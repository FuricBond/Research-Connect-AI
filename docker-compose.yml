# ResearchConnect AI — full stack (Phase 6.1)
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD and AUTH_SECRET_KEY
#   docker compose up --build -d
#
# Startup order: postgres (healthy) -> migrate (alembic upgrade head, exits) -> backend
# (healthy) -> frontend. Configuration comes from the root .env; each container receives
# only the variables listed under its `environment`.
#
# Ports are published on 127.0.0.1 only. The browser calls the API directly, so the backend
# port must be reachable from wherever the browser runs; PostgreSQL stays host-local for
# running the backend or its tests on the host. See the README before exposing anything
# beyond this machine.

name: researchconnect-ai

x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER:-researchconnect}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-researchconnect}"

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: researchconnect-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-researchconnect}
      POSTGRES_USER: ${POSTGRES_USER:-researchconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP on purpose: during first-time initialisation the image runs a temporary
      # server that listens on the Unix socket only, so a socket check would report ready
      # before other containers can connect.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  # One-shot schema migration. Runs to completion before the backend starts, so migrations
  # never race each other or a serving API.
  migrate:
    build: *backend-build
    image: researchconnect-backend:local
    command: ["sh", "-c", "python -m scripts.wait_for_db && alembic upgrade head"]
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardening
    init: true
    restart: "no"

  backend:
    build: *backend-build
    image: researchconnect-backend:local
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: *database-url
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env (see .env.example)}
      # The raw X-User-ID header is a development shortcut; never in a container deployment.
      AUTH_DEV_IDENTITY_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Phase 6.3 background scheduler, off unless set in .env. Opportunity refresh is the
      # one job that makes outbound requests (WikiCFP) and has its own switch.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_OPPORTUNITY_REFRESH_ENABLED: ${SCHEDULER_OPPORTUNITY_REFRESH_ENABLED:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    <<: *hardening
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: researchconnect-frontend:local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    <<: *hardening
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
