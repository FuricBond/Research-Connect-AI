[pytest]
pythonpath = .
testpaths = tests
# Wall-clock performance budgets are machine-sensitive, so the default run leaves them out;
# run them on their own with `pytest -m perf` (a later -m overrides this one).
addopts = -m "not perf"
markers =
    postgres_integration: requires a live PostgreSQL + pgvector database (skipped when unreachable)
    perf: wall-clock performance budget; excluded by default, run with `pytest -m perf`
